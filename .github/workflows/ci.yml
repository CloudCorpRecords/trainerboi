name: CI

on:
  push: { branches: [main] }
  pull_request:

jobs:
  checks:
    strategy:
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: "3.11" }
      - name: Python syntax check
        run: python -m compileall -q .
      - name: Unit tests (no dependencies needed)
        run: python -m unittest discover -s tests -v

      - name: Shell script syntax check
        if: runner.os == 'macOS'
        shell: bash
        run: bash -n setup.sh && bash -n START.sh && bash -n scripts/setup.sh

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 22 }
      - name: Build the UI
        working-directory: ui
        run: |
          npm ci
          npm run build
      - name: Audit UI dependencies
        working-directory: ui
        run: npm audit --omit=dev
      - name: Check the desktop shell
        working-directory: desktop
        run: |
          npm ci
          node --check main.js
          npm audit --omit=dev

      - name: No secrets or personal paths committed
        shell: bash
        run: |
          ! git grep -nE "hf_[A-Za-z0-9]{30,}|ghp_[A-Za-z0-9]{30,}|AKIA[A-Z0-9]{16}|Users.{1,2}cloud" -- . ':!*.md' ':!.github' ':!*.png'
