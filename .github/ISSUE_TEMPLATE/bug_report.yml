name: Bug report
description: Something in TrainerBoi doesn't work the way it should.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time. Found a security problem? Please don't file it here; use **Security → Report a vulnerability** instead.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open TrainerBoi
        2. Start a Guided training with …
        3. …
  - type: dropdown
    id: install
    attributes:
      label: How do you run it?
      options:
        - Desktop installer
        - From source (START.bat)
        - From source (launch_desktop.bat)
        - API server / CLI
    validations:
      required: true
  - type: input
    id: gpu
    attributes:
      label: GPU, driver and Windows version
      placeholder: "RTX 3080 Ti Laptop 16 GB, driver 580.xx, Windows 11 24H2"
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Technical log
      description: From the failing run (Run page → Show technical log), or `studio.log` / `desktop.log`. Please remove anything private first.
      render: text
