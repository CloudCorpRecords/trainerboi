<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>TrainerBoi setup</title>
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'unsafe-inline'; script-src 'self'">
<style>
  :root { color-scheme: dark; }
  body { margin:0; background:#0b0f19; color:#e5e7eb; font-family:'Segoe UI',system-ui,sans-serif; padding:30px 36px; }
  h1 { margin:0 0 4px; font-size:26px; } .sub { opacity:.7; margin-bottom:18px; }
  .gpu { padding:10px 14px; border-radius:10px; background:#111827; border:1px solid rgba(255,255,255,.08); margin-bottom:18px; font-size:14px; }
  ol { list-style:none; padding:0; margin:0 0 16px; }
  li { padding:8px 0; display:flex; gap:10px; align-items:center; opacity:.45; }
  li.active { opacity:1; font-weight:600; } li.done { opacity:.9; }
  li .dot { width:18px; text-align:center; }
  pre { height:170px; overflow:auto; background:#05070d; border:1px solid rgba(255,255,255,.08); border-radius:10px; padding:10px; font-size:11.5px; margin:0; white-space:pre-wrap; }
  .bar { height:6px; border-radius:6px; background:#1f2937; overflow:hidden; margin-bottom:14px; }
  .bar i { display:block; height:100%; width:0; background:linear-gradient(90deg,#6366f1,#22d3ee); transition:width .4s; }
  a { color:#22d3ee; cursor:pointer; font-size:13px; }
</style></head>
<body>
  <h1>🚂 Setting up TrainerBoi</h1>
  <div class="sub">One-time setup (5-15 minutes, mostly downloading). Needs an internet connection.</div>
  <div class="gpu" id="gpu">Looking at your computer…</div>
  <div class="bar"><i id="bar"></i></div>
  <ol id="steps"></ol>
  <pre id="log"></pre>
  <p><a id="logLink">Open full log</a></p>
  <script src="setup.js"></script>
</body></html>
